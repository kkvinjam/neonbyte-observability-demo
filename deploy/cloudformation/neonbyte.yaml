AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::LanguageExtensions
Description: >-
  NeonByte Electronics - an observability demo store: 5 Python microservices on ECS Fargate
  (ADOT + CloudWatch agent / Application Signals), 5 multi-framework AI agents on Amazon Bedrock
  AgentCore Runtime behind an AgentCore Gateway, CloudFront storefront, CloudWatch dashboard and
  a continuous traffic generator. Images are built from source by CodeBuild during stack creation.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: Source code }
        Parameters: [SourceS3Uri, SourceRepoUrl, SourceBranch, ImageTag]
      - Label: { default: Networking }
        Parameters: [AvailabilityZoneId1, AvailabilityZoneId2, VpcCidr]
      - Label: { default: Models (Amazon Bedrock) }
        Parameters: [ClaudeModelId, NovaLiteModelId, LlamaModelId, GptOssModelId, EnableGuardrail]
      - Label: { default: Observability }
        Parameters: [EnableTransactionSearch, EnableApplicationSignalsDiscovery, LogRetentionDays]
      - Label: { default: Capacity and traffic }
        Parameters: [ServiceDesiredCount, LoadGenDesiredCount, LoadGenUsers, LoadGenChatProbability]

Parameters:
  SourceS3Uri:
    Type: String
    Default: ""
    Description: s3://bucket/key.zip of the repository (deploy.sh uploads one). Takes precedence over SourceRepoUrl.
  SourceRepoUrl:
    Type: String
    Default: ""
    Description: Public git URL of this repository, used when SourceS3Uri is empty.
  SourceBranch:
    Type: String
    Default: main
  ImageTag:
    Type: String
    Default: v1
    AllowedPattern: "^[a-zA-Z0-9][a-zA-Z0-9._-]{0,63}$"
    Description: Tag for every image. Change it on a stack update to rebuild all images and roll services and agents.
  AvailabilityZoneId1:
    Type: String
    Default: ""
    Description: AZ ID (e.g. use1-az1) supported by AgentCore Runtime VPC mode. Empty = regional default from the template.
  AvailabilityZoneId2:
    Type: String
    Default: ""
    Description: Second AgentCore-supported AZ ID (e.g. use1-az2). Empty = regional default.
  VpcCidr:
    Type: String
    Default: 10.42.0.0/16
    AllowedPattern: "^(\\d{1,3}\\.){3}\\d{1,3}/16$"
  ClaudeModelId:
    Type: String
    Default: us.anthropic.claude-sonnet-4-6
    Description: Orchestrator + Product Advisor model (inference profile id). Use eu./apac. prefixes outside the US.
  NovaLiteModelId:
    Type: String
    Default: us.amazon.nova-2-lite-v1:0
    Description: Order Desk (CrewAI) model.
  LlamaModelId:
    Type: String
    Default: us.meta.llama4-maverick-17b-instruct-v1:0
    Description: Customer Support (LlamaIndex) model.
  GptOssModelId:
    Type: String
    Default: openai.gpt-oss-120b-1:0
    Description: Concierge (OpenAI Agents SDK) model.
  EnableGuardrail:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
  EnableTransactionSearch:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Set false if CloudWatch Transaction Search is already enabled in this account and region.
  EnableApplicationSignalsDiscovery:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Set false if Application Signals is already enabled in this account and region.
  LogRetentionDays:
    Type: Number
    Default: 7
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90]
  ServiceDesiredCount:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 4
  LoadGenDesiredCount:
    Type: Number
    Default: 1
    MinValue: 0
    MaxValue: 4
    Description: Traffic generator tasks (0 = off). Each runs LoadGenUsers simulated shoppers.
  LoadGenUsers:
    Type: Number
    Default: 5
    MinValue: 1
    MaxValue: 50
  LoadGenChatProbability:
    Type: String
    Default: "0.05"
    AllowedPattern: "^(0(\\.\\d+)?|1(\\.0+)?)$"
    Description: Chance per shopper journey of an assistant chat (each chat = several Bedrock calls; drives cost).

Rules:
  SourceProvided:
    Assertions:
      - Assert: !Not [!And [!Equals [!Ref SourceS3Uri, ""], !Equals [!Ref SourceRepoUrl, ""]]]
        AssertDescription: Provide SourceS3Uri or SourceRepoUrl.

Mappings:
  # Default AZ IDs where AgentCore Runtime supports VPC networking. Override with the AZ ID parameters.
  RegionAzs:
    us-east-1: { Az1: use1-az1, Az2: use1-az2 }
    us-east-2: { Az1: use2-az1, Az2: use2-az2 }
    us-west-2: { Az1: usw2-az1, Az2: usw2-az2 }
    eu-central-1: { Az1: euc1-az1, Az2: euc1-az2 }
    eu-west-1: { Az1: euw1-az1, Az2: euw1-az2 }
    ap-southeast-1: { Az1: apse1-az1, Az2: apse1-az2 }
    ap-southeast-2: { Az1: apse2-az1, Az2: apse2-az2 }
    ap-northeast-1: { Az1: apne1-az1, Az2: apne1-az4 }
    ap-south-1: { Az1: aps1-az1, Az2: aps1-az2 }
  # Per-agent wiring. Runtime name = NeonByte<Agent>; the Application Signals node is <runtime>.DEFAULT.
  Agents:
    Orchestrator: { Repo: agent-orchestrator, Target: orchestrator }
    Advisor: { Repo: agent-advisor, Target: advisor }
    OrderDesk: { Repo: agent-orderdesk, Target: orderdesk }
    Support: { Repo: agent-support, Target: support }
    Concierge: { Repo: agent-concierge, Target: concierge }

Conditions:
  UseS3Source: !Not [!Equals [!Ref SourceS3Uri, ""]]
  HasAz1: !Not [!Equals [!Ref AvailabilityZoneId1, ""]]
  HasAz2: !Not [!Equals [!Ref AvailabilityZoneId2, ""]]
  GuardrailOn: !Equals [!Ref EnableGuardrail, "true"]
  TransactionSearchOn: !Equals [!Ref EnableTransactionSearch, "true"]
  DiscoveryOn: !Equals [!Ref EnableApplicationSignalsDiscovery, "true"]

Resources:
  # =====================================================================================
  # Network: 2 public + 2 private subnets, one NAT gateway, VPC flow logs to CloudWatch
  # =====================================================================================
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags: [{ Key: Name, Value: neonbyte-vpc }]
  InternetGateway:
    Type: AWS::EC2::InternetGateway
  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties: { VpcId: !Ref Vpc, InternetGatewayId: !Ref InternetGateway }

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZoneId: !If [HasAz1, !Ref AvailabilityZoneId1, !FindInMap [RegionAzs, !Ref "AWS::Region", Az1]]
      CidrBlock: !Select [0, !Cidr [!Ref VpcCidr, 4, 12]]
      Tags: [{ Key: Name, Value: neonbyte-public-1 }]
  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZoneId: !If [HasAz2, !Ref AvailabilityZoneId2, !FindInMap [RegionAzs, !Ref "AWS::Region", Az2]]
      CidrBlock: !Select [1, !Cidr [!Ref VpcCidr, 4, 12]]
      Tags: [{ Key: Name, Value: neonbyte-public-2 }]
  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZoneId: !If [HasAz1, !Ref AvailabilityZoneId1, !FindInMap [RegionAzs, !Ref "AWS::Region", Az1]]
      CidrBlock: !Select [2, !Cidr [!Ref VpcCidr, 4, 12]]
      Tags: [{ Key: Name, Value: neonbyte-private-1 }]
  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZoneId: !If [HasAz2, !Ref AvailabilityZoneId2, !FindInMap [RegionAzs, !Ref "AWS::Region", Az2]]
      CidrBlock: !Select [3, !Cidr [!Ref VpcCidr, 4, 12]]
      Tags: [{ Key: Name, Value: neonbyte-private-2 }]

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties: { VpcId: !Ref Vpc }
  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties: { RouteTableId: !Ref PublicRouteTable, DestinationCidrBlock: 0.0.0.0/0, GatewayId: !Ref InternetGateway }
  PublicSubnet1Routes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PublicSubnet1, RouteTableId: !Ref PublicRouteTable }
  PublicSubnet2Routes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PublicSubnet2, RouteTableId: !Ref PublicRouteTable }
  NatEip:
    Type: AWS::EC2::EIP
    DependsOn: GatewayAttachment
    Properties: { Domain: vpc }
  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties: { AllocationId: !GetAtt NatEip.AllocationId, SubnetId: !Ref PublicSubnet1 }
  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties: { VpcId: !Ref Vpc }
  PrivateDefaultRoute:
    Type: AWS::EC2::Route
    Properties: { RouteTableId: !Ref PrivateRouteTable, DestinationCidrBlock: 0.0.0.0/0, NatGatewayId: !Ref NatGateway }
  PrivateSubnet1Routes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PrivateSubnet1, RouteTableId: !Ref PrivateRouteTable }
  PrivateSubnet2Routes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PrivateSubnet2, RouteTableId: !Ref PrivateRouteTable }
  DynamoDbEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub com.amazonaws.${AWS::Region}.dynamodb
      VpcEndpointType: Gateway
      RouteTableIds: [!Ref PrivateRouteTable]

  FlowLogGroup:
    Type: AWS::Logs::LogGroup
    Properties: { LogGroupName: /neonbyte/vpc/flowlogs, RetentionInDays: !Ref LogRetentionDays }
  FlowLogRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: vpc-flow-logs.amazonaws.com }
            Action: sts:AssumeRole
            Condition: { StringEquals: { aws:SourceAccount: !Ref "AWS::AccountId" } }
      Policies:
        - PolicyName: flowlogs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents, logs:DescribeLogStreams]
                Resource: !Sub ${FlowLogGroup.Arn}
  FlowLog:
    Type: AWS::EC2::FlowLog
    Properties:
      ResourceId: !Ref Vpc
      ResourceType: VPC
      TrafficType: ALL
      LogDestinationType: cloud-watch-logs
      LogGroupName: !Ref FlowLogGroup
      DeliverLogsPermissionArn: !GetAtt FlowLogRole.Arn

  # Security groups: the public ALB accepts only CloudFront origin-facing traffic; every
  # service and agent ENI shares AppSecurityGroup and talks to its peers on 8080 only.
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: NeonByte ALB - HTTP from CloudFront origin-facing IPs only
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourcePrefixListId: !GetAtt CloudFrontPrefixList.Id
          Description: CloudFront origin-facing
  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: NeonByte services and agents
      VpcId: !Ref Vpc
  AppIngressFromAlb:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref AppSecurityGroup
      IpProtocol: tcp
      FromPort: 8080
      ToPort: 8080
      SourceSecurityGroupId: !Ref AlbSecurityGroup
      Description: ALB to storefront
  AppIngressFromApp:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref AppSecurityGroup
      IpProtocol: tcp
      FromPort: 8080
      ToPort: 8080
      SourceSecurityGroupId: !Ref AppSecurityGroup
      Description: service-to-service and agent-to-service

  # =====================================================================================
  # Helper Lambda: CloudFront prefix-list lookup + kicking off the CodeBuild image build
  # =====================================================================================
  HelperRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement: [{ Effect: Allow, Principal: { Service: lambda.amazonaws.com }, Action: sts:AssumeRole }]
      ManagedPolicyArns: [!Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"]
      Policies:
        - PolicyName: helper
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ec2:DescribeManagedPrefixLists
                Resource: "*"
              - Effect: Allow
                Action: codebuild:StartBuild
                Resource: !GetAtt ImageBuildProject.Arn
  HelperFunction:
    Type: AWS::Lambda::Function
    Properties:
      Description: NeonByte CloudFormation helper (prefix list lookup, image build trigger)
      Runtime: python3.13
      Architectures: [arm64]
      Handler: index.handler
      Timeout: 60
      Role: !GetAtt HelperRole.Arn
      Code:
        ZipFile: |
          import json, urllib.request, boto3

          def send(e, ctx, status, data=None, pid=None, reason=""):
              body = json.dumps({
                  "Status": status, "Reason": reason or f"See {ctx.log_stream_name}",
                  "PhysicalResourceId": pid or e.get("PhysicalResourceId") or e["LogicalResourceId"],
                  "StackId": e["StackId"], "RequestId": e["RequestId"],
                  "LogicalResourceId": e["LogicalResourceId"], "Data": data or {}}).encode()
              req = urllib.request.Request(e["ResponseURL"], data=body, method="PUT", headers={"Content-Type": ""})
              urllib.request.urlopen(req, timeout=30)

          def handler(e, ctx):
              p = e["ResourceProperties"]
              try:
                  if e["RequestType"] == "Delete":
                      return send(e, ctx, "SUCCESS")
                  if p["Kind"] == "PrefixList":
                      pl = boto3.client("ec2").describe_managed_prefix_lists(
                          Filters=[{"Name": "prefix-list-name", "Values": [p["Name"]]}])["PrefixLists"][0]
                      return send(e, ctx, "SUCCESS", {"Id": pl["PrefixListId"]}, pl["PrefixListId"])
                  if p["Kind"] == "ImageBuild":
                      env = {"CFN_RESPONSE_URL": e["ResponseURL"], "CFN_STACK_ID": e["StackId"],
                             "CFN_REQUEST_ID": e["RequestId"], "CFN_LOGICAL_ID": e["LogicalResourceId"],
                             "CFN_PHYSICAL_ID": e.get("PhysicalResourceId") or "neonbyte-images",
                             "IMAGE_TAG": p["ImageTag"]}
                      build = boto3.client("codebuild").start_build(
                          projectName=p["Project"],
                          environmentVariablesOverride=[{"name": k, "value": v, "type": "PLAINTEXT"} for k, v in env.items()])
                      print("started", build["build"]["id"])
                      return  # CodeBuild answers CloudFormation when the build finishes
                  send(e, ctx, "FAILED", reason="unknown Kind")
              except Exception as exc:
                  print(exc)
                  send(e, ctx, "FAILED", reason=str(exc)[:400])
  CloudFrontPrefixList:
    Type: Custom::PrefixList
    Properties:
      ServiceToken: !GetAtt HelperFunction.Arn
      Kind: PrefixList
      Name: com.amazonaws.global.cloudfront.origin-facing

  # =====================================================================================
  # Container images: ECR repositories + CodeBuild (arm64) that builds them from source
  # =====================================================================================
  Fn::ForEach::Repositories:
    - Repo
    - [storefront, catalog, cart, orders, payments, loadgen, agent-orchestrator, agent-advisor, agent-orderdesk, agent-support, agent-concierge]
    - "Ecr&{Repo}":
        Type: AWS::ECR::Repository
        Properties:
          RepositoryName: !Sub neonbyte/${Repo}
          EmptyOnDelete: true
          ImageScanningConfiguration: { ScanOnPush: true }
          LifecyclePolicy:
            LifecyclePolicyText: '{"rules":[{"rulePriority":1,"description":"keep 10","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":10},"action":{"type":"expire"}}]}'

  BuildLogGroup:
    Type: AWS::Logs::LogGroup
    Properties: { LogGroupName: /neonbyte/codebuild, RetentionInDays: !Ref LogRetentionDays }
  ImageBuildRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: codebuild.amazonaws.com }
            Action: sts:AssumeRole
            Condition: { StringEquals: { aws:SourceAccount: !Ref "AWS::AccountId" } }
      Policies:
        - PolicyName: build
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub ${BuildLogGroup.Arn}:*
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:CompleteLayerUpload
                  - ecr:GetDownloadUrlForLayer
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource: !Sub arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/neonbyte/*
              - !If
                - UseS3Source
                - Effect: Allow
                  Action: s3:GetObject
                  Resource: !Sub
                    - arn:${AWS::Partition}:s3:::${Path}
                    - Path: !Select [1, !Split ["s3://", !Ref SourceS3Uri]]
                - !Ref AWS::NoValue
  ImageBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: neonbyte-image-build
      Description: Builds all NeonByte container images (linux/arm64) and pushes them to ECR
      ServiceRole: !GetAtt ImageBuildRole.Arn
      TimeoutInMinutes: 50
      Artifacts: { Type: NO_ARTIFACTS }
      LogsConfig: { CloudWatchLogs: { Status: ENABLED, GroupName: !Ref BuildLogGroup } }
      Environment:
        Type: ARM_CONTAINER
        ComputeType: BUILD_GENERAL1_LARGE
        Image: aws/codebuild/amazonlinux-aarch64-standard:3.0
        PrivilegedMode: true
        EnvironmentVariables:
          - { Name: REGISTRY, Value: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com" }
          - { Name: SOURCE_S3_URI, Value: !Ref SourceS3Uri }
          - { Name: SOURCE_REPO_URL, Value: !Ref SourceRepoUrl }
          - { Name: SOURCE_BRANCH, Value: !Ref SourceBranch }
          - { Name: IMAGE_TAG, Value: !Ref ImageTag }
      Source:
        Type: NO_SOURCE
        BuildSpec: |
          version: 0.2
          phases:
            build:
              commands:
                - |
                  set -e
                  if [ -n "$SOURCE_S3_URI" ]; then
                    aws s3 cp "$SOURCE_S3_URI" /tmp/src.zip && mkdir -p src && unzip -q /tmp/src.zip -d src
                  else
                    git clone --depth 1 --branch "$SOURCE_BRANCH" "$SOURCE_REPO_URL" src
                  fi
                  cd src && bash deploy/scripts/build-images.sh "$REGISTRY" "$IMAGE_TAG"
            post_build:
              commands:
                - |
                  if [ -n "$CFN_RESPONSE_URL" ]; then
                    export STATUS=SUCCESS
                    [ "$CODEBUILD_BUILD_SUCCEEDING" = "1" ] || export STATUS=FAILED
                    python3 -c 'import json,os; e=os.environ; print(json.dumps({"Status":e["STATUS"],"Reason":"CodeBuild "+e["CODEBUILD_BUILD_ID"],"PhysicalResourceId":e["CFN_PHYSICAL_ID"],"StackId":e["CFN_STACK_ID"],"RequestId":e["CFN_REQUEST_ID"],"LogicalResourceId":e["CFN_LOGICAL_ID"],"Data":{"ImageTag":e["IMAGE_TAG"]}}))' > /tmp/cfn.json
                    curl -sS -X PUT -H 'Content-Type:' --data-binary @/tmp/cfn.json "$CFN_RESPONSE_URL"
                  fi
  # Create/Update starts a build; the stack waits (up to an hour) for CodeBuild to report back.
  ContainerImages:
    Type: Custom::ImageBuild
    DependsOn:
      - Ecrstorefront
      - Ecrcatalog
      - Ecrcart
      - Ecrorders
      - Ecrpayments
      - Ecrloadgen
      - Ecragentorchestrator
      - Ecragentadvisor
      - Ecragentorderdesk
      - Ecragentsupport
      - Ecragentconcierge
    Properties:
      ServiceToken: !GetAtt HelperFunction.Arn
      ServiceTimeout: 3600
      Kind: ImageBuild
      Project: !Ref ImageBuildProject
      ImageTag: !Ref ImageTag

  # =====================================================================================
  # Data: DynamoDB tables + SSM parameters (service discovery for agents, chaos knobs)
  # =====================================================================================
  ProductsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: neonbyte-products
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{ AttributeName: product_id, AttributeType: S }]
      KeySchema: [{ AttributeName: product_id, KeyType: HASH }]
  CartsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: neonbyte-carts
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{ AttributeName: user_id, AttributeType: S }]
      KeySchema: [{ AttributeName: user_id, KeyType: HASH }]
  OrdersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: neonbyte-orders
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: user_id, AttributeType: S }
        - { AttributeName: order_id, AttributeType: S }
      KeySchema:
        - { AttributeName: user_id, KeyType: HASH }
        - { AttributeName: order_id, KeyType: RANGE }

  Fn::ForEach::ServiceUrlParams:
    - Svc
    - [catalog, cart, orders, payments]
    - "Param${Svc}Url":
        Type: AWS::SSM::Parameter
        Properties:
          Name: !Sub /neonbyte/${Svc}url
          Type: String
          Value: !Sub http://${Svc}.neonbyte.local:8080
  Fn::ForEach::ChaosParams:
    - Svc
    - [storefront, catalog, cart, orders, payments]
    - "Chaos${Svc}Latency":
        Type: AWS::SSM::Parameter
        Properties:
          Name: !Sub /neonbyte/chaos/${Svc}/latency_ms
          Type: String
          Value: "0"
          Description: Extra latency (ms) injected into every request of this service
      "Chaos${Svc}ErrorRate":
        Type: AWS::SSM::Parameter
        Properties:
          Name: !Sub /neonbyte/chaos/${Svc}/error_rate
          Type: String
          Value: "0"
          Description: Fraction (0-1) of requests this service fails with HTTP 500
  ParamDeclineRate:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /neonbyte/payments/decline_rate
      Type: String
      Value: "0.03"
      Description: Fraction of card payments declined (HTTP 402)

  # =====================================================================================
  # Observability foundation: Application Signals + X-Ray Transaction Search
  # =====================================================================================
  ApplicationSignalsDiscovery:
    Type: AWS::ApplicationSignals::Discovery
    Condition: DiscoveryOn
  TransactionSearchPolicy:
    Type: AWS::Logs::ResourcePolicy
    Condition: TransactionSearchOn
    Properties:
      PolicyName: NeonByteTransactionSearchAccess
      PolicyDocument: !Sub |
        {"Version":"2012-10-17","Statement":[{"Sid":"TransactionSearchXRayAccess","Effect":"Allow",
          "Principal":{"Service":"xray.amazonaws.com"},"Action":"logs:PutLogEvents",
          "Resource":["arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:aws/spans:*",
                      "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/application-signals/data:*"],
          "Condition":{"ArnLike":{"aws:SourceArn":"arn:${AWS::Partition}:xray:${AWS::Region}:${AWS::AccountId}:*"},
                       "StringEquals":{"aws:SourceAccount":"${AWS::AccountId}"}}}]}
  TransactionSearch:
    Type: AWS::XRay::TransactionSearchConfig
    Condition: TransactionSearchOn
    DependsOn: TransactionSearchPolicy
    Properties:
      IndexingPercentage: 10
  LocalAgentsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /neonbyte/local/agents
      RetentionInDays: !Ref LogRetentionDays

  # =====================================================================================
  # ECS: cluster (Container Insights enhanced), Cloud Map, roles, task definitions
  # =====================================================================================
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: neonbyte-cluster
      ClusterSettings: [{ Name: containerInsights, Value: enhanced }]
  Namespace:
    Type: AWS::ServiceDiscovery::PrivateDnsNamespace
    Properties: { Name: neonbyte.local, Vpc: !Ref Vpc }

  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement: [{ Effect: Allow, Principal: { Service: ecs-tasks.amazonaws.com }, Action: sts:AssumeRole }]
      ManagedPolicyArns: [!Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy"]
  # One task role for the demo services: DynamoDB tables, /neonbyte/* parameters, the
  # CloudWatch agent sidecar, ECS Exec, and (storefront) invoking the orchestrator agent.
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
            Condition: { StringEquals: { aws:SourceAccount: !Ref "AWS::AccountId" } }
      Policies:
        - PolicyName: neonbyte-app
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:DeleteItem, dynamodb:UpdateItem, dynamodb:Query, dynamodb:Scan]
                Resource: [!GetAtt ProductsTable.Arn, !GetAtt CartsTable.Arn, !GetAtt OrdersTable.Arn]
              - Effect: Allow
                Action: [ssm:GetParameter, ssm:GetParameters]
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/neonbyte/*
              - Effect: Allow
                Action: bedrock-agentcore:InvokeAgentRuntime
                Resource: !Sub arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:runtime/NeonByteOrchestrator*
              - Effect: Allow  # CloudWatch agent sidecar (Application Signals)
                Action:
                  - cloudwatch:PutMetricData
                  - logs:PutLogEvents
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:DescribeLogStreams
                  - logs:DescribeLogGroups
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                  - xray:GetSamplingRules
                  - xray:GetSamplingTargets
                  - xray:GetSamplingStatisticSummaries
                Resource: "*"
              - Effect: Allow  # ECS Exec
                Action: [ssmmessages:CreateControlChannel, ssmmessages:CreateDataChannel, ssmmessages:OpenControlChannel, ssmmessages:OpenDataChannel]
                Resource: "*"

  CloudWatchAgentLogGroup:
    Type: AWS::Logs::LogGroup
    Properties: { LogGroupName: /neonbyte/ecs/cloudwatch-agent, RetentionInDays: !Ref LogRetentionDays }

  # Every app task = app container + ADOT Python init container + CloudWatch agent sidecar,
  # the same zero-code Application Signals setup as the reference petlistadoptions-py service.
  Fn::ForEach::Apps:
    - App
    - [storefront, catalog, cart, orders, payments]
    - "${App}LogGroup":
        Type: AWS::Logs::LogGroup
        Properties:
          LogGroupName: !Sub /neonbyte/ecs/${App}
          RetentionInDays: !Ref LogRetentionDays
      "${App}Discovery":
        Type: AWS::ServiceDiscovery::Service
        Properties:
          Name: !Ref App
          NamespaceId: !Ref Namespace
          DnsConfig:
            RoutingPolicy: MULTIVALUE
            DnsRecords: [{ Type: A, TTL: 10 }]
          HealthCheckCustomConfig: { FailureThreshold: 1 }
      "${App}TaskDefinition":
        Type: AWS::ECS::TaskDefinition
        DependsOn: ContainerImages
        Properties:
          Family: !Sub neonbyte-${App}
          RequiresCompatibilities: [FARGATE]
          NetworkMode: awsvpc
          Cpu: "512"
          Memory: "1024"
          RuntimePlatform: { CpuArchitecture: ARM64, OperatingSystemFamily: LINUX }
          ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
          TaskRoleArn: !GetAtt TaskRole.Arn
          Volumes: [{ Name: opentelemetry-auto-instrumentation-python }]
          ContainerDefinitions:
            - Name: init
              Image: public.ecr.aws/aws-observability/adot-autoinstrumentation-python:v0.12.2
              Essential: false
              Command: [cp, -a, /autoinstrumentation/., /otel-auto-instrumentation-python]
              MountPoints: [{ SourceVolume: opentelemetry-auto-instrumentation-python, ContainerPath: /otel-auto-instrumentation-python, ReadOnly: false }]
              LogConfiguration:
                LogDriver: awslogs
                Options: { awslogs-group: !Ref CloudWatchAgentLogGroup, awslogs-region: !Ref "AWS::Region", awslogs-stream-prefix: !Sub "${App}-init" }
            - Name: cloudwatch-agent
              Image: public.ecr.aws/cloudwatch-agent/cloudwatch-agent:latest
              Essential: true
              Cpu: 128
              Memory: 256
              Environment:
                - Name: CW_CONFIG_CONTENT
                  Value: '{"traces":{"traces_collected":{"application_signals":{}}},"logs":{"metrics_collected":{"application_signals":{}}}}'
              LogConfiguration:
                LogDriver: awslogs
                Options: { awslogs-group: !Ref CloudWatchAgentLogGroup, awslogs-region: !Ref "AWS::Region", awslogs-stream-prefix: !Ref App }
            - Name: app
              Image: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/neonbyte/${App}:${ImageTag}"
              Essential: true
              PortMappings: [{ ContainerPort: 8080, Protocol: tcp }]
              DependsOn:
                - { ContainerName: init, Condition: SUCCESS }
                - { ContainerName: cloudwatch-agent, Condition: START }
              MountPoints: [{ SourceVolume: opentelemetry-auto-instrumentation-python, ContainerPath: /otel-auto-instrumentation-python, ReadOnly: false }]
              HealthCheck:
                Command: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
                Interval: 15
                Timeout: 5
                Retries: 3
                StartPeriod: 30
              Environment:
                - { Name: AWS_REGION, Value: !Ref "AWS::Region" }
                - { Name: PARAMETER_STORE_PREFIX, Value: /neonbyte }
                - { Name: PRODUCTS_TABLE, Value: !Ref ProductsTable }
                - { Name: CARTS_TABLE, Value: !Ref CartsTable }
                - { Name: ORDERS_TABLE, Value: !Ref OrdersTable }
                - { Name: CATALOG_URL, Value: http://catalog.neonbyte.local:8080 }
                - { Name: CART_URL, Value: http://cart.neonbyte.local:8080 }
                - { Name: ORDERS_URL, Value: http://orders.neonbyte.local:8080 }
                - { Name: PAYMENTS_URL, Value: http://payments.neonbyte.local:8080 }
                # ADOT Python zero-code instrumentation -> CloudWatch agent sidecar -> Application Signals / X-Ray
                - { Name: PYTHONPATH, Value: /otel-auto-instrumentation-python/opentelemetry/instrumentation/auto_instrumentation:/app:/otel-auto-instrumentation-python }
                - { Name: OTEL_RESOURCE_ATTRIBUTES, Value: !Sub "service.name=${App},service.namespace=neonbyte,deployment.environment=ecs:neonbyte-cluster" }
                - { Name: OTEL_AWS_APPLICATION_SIGNALS_ENABLED, Value: "true" }
                - { Name: OTEL_METRICS_EXPORTER, Value: none }
                - { Name: OTEL_LOGS_EXPORTER, Value: none }
                - { Name: OTEL_EXPORTER_OTLP_PROTOCOL, Value: http/protobuf }
                - { Name: OTEL_AWS_APPLICATION_SIGNALS_EXPORTER_ENDPOINT, Value: "http://localhost:4316/v1/metrics" }
                - { Name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT, Value: "http://localhost:4316/v1/traces" }
                - { Name: OTEL_TRACES_SAMPLER, Value: xray }
                - { Name: OTEL_TRACES_SAMPLER_ARG, Value: "endpoint=http://localhost:2000" }
                - { Name: OTEL_PROPAGATORS, Value: tracecontext,baggage,xray }
                - { Name: OTEL_PYTHON_CONFIGURATOR, Value: aws_configurator }
                - { Name: OTEL_PYTHON_DISTRO, Value: aws_distro }
                - { Name: OTEL_PYTHON_LOG_CORRELATION, Value: "true" }
                - { Name: OTEL_PYTHON_EXCLUDED_URLS, Value: /health }
              LogConfiguration:
                LogDriver: awslogs
                Options: { awslogs-group: !Ref { "Fn::Sub": "${App}LogGroup" }, awslogs-region: !Ref "AWS::Region", awslogs-stream-prefix: app }

  Fn::ForEach::BackendServices:
    - Svc
    - [catalog, cart, orders, payments]
    - "${Svc}Service":
        Type: AWS::ECS::Service
        DependsOn: [PrivateDefaultRoute, AppIngressFromApp]
        Properties:
          ServiceName: !Ref Svc
          Cluster: !Ref Cluster
          LaunchType: FARGATE
          DesiredCount: !Ref ServiceDesiredCount
          TaskDefinition: !Ref { "Fn::Sub": "${Svc}TaskDefinition" }
          EnableExecuteCommand: true
          DeploymentConfiguration:
            DeploymentCircuitBreaker: { Enable: true, Rollback: true }
            MinimumHealthyPercent: 100
            MaximumPercent: 200
          NetworkConfiguration:
            AwsvpcConfiguration:
              AssignPublicIp: DISABLED
              Subnets: [!Ref PrivateSubnet1, !Ref PrivateSubnet2]
              SecurityGroups: [!Ref AppSecurityGroup]
          ServiceRegistries: [{ RegistryArn: !GetAtt [!Sub "${Svc}Discovery", Arn] }]

  # =====================================================================================
  # Storefront: ALB (CloudFront-only) + ECS service + CloudFront (HTTPS for shoppers)
  # The storefront is a public retail demo site: anonymous browsing is the intended audience.
  # =====================================================================================
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    DependsOn: PublicDefaultRoute
    Properties:
      Scheme: internet-facing
      Subnets: [!Ref PublicSubnet1, !Ref PublicSubnet2]
      SecurityGroups: [!Ref AlbSecurityGroup]
      LoadBalancerAttributes:
        - { Key: routing.http.drop_invalid_header_fields.enabled, Value: "true" }
        - { Key: idle_timeout.timeout_seconds, Value: "180" }  # assistant chats can take a while
  StorefrontTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref Vpc
      TargetType: ip
      Protocol: HTTP
      Port: 8080
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      TargetGroupAttributes: [{ Key: deregistration_delay.timeout_seconds, Value: "15" }]
  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions: [{ Type: forward, TargetGroupArn: !Ref StorefrontTargetGroup }]
  StorefrontService:
    Type: AWS::ECS::Service
    DependsOn: [HttpListener, PrivateDefaultRoute, AppIngressFromApp, AppIngressFromAlb]
    Properties:
      ServiceName: storefront
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      DesiredCount: !Ref ServiceDesiredCount
      TaskDefinition: !Ref storefrontTaskDefinition
      EnableExecuteCommand: true
      HealthCheckGracePeriodSeconds: 60
      DeploymentConfiguration:
        DeploymentCircuitBreaker: { Enable: true, Rollback: true }
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets: [!Ref PrivateSubnet1, !Ref PrivateSubnet2]
          SecurityGroups: [!Ref AppSecurityGroup]
      LoadBalancers: [{ ContainerName: app, ContainerPort: 8080, TargetGroupArn: !Ref StorefrontTargetGroup }]
      ServiceRegistries: [{ RegistryArn: !GetAtt storefrontDiscovery.Arn }]
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: NeonByte Electronics storefront
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        Origins:
          - Id: alb
            DomainName: !GetAtt LoadBalancer.DNSName
            CustomOriginConfig:
              OriginProtocolPolicy: http-only
              HTTPPort: 80
              OriginReadTimeout: 60
              OriginKeepaliveTimeout: 60
        DefaultCacheBehavior:
          TargetOriginId: alb
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad       # Managed-CachingDisabled
          OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3 # Managed-AllViewer (cookies, query, X-User-Id)
          Compress: true
        CacheBehaviors:
          - PathPattern: /static/*
            TargetOriginId: alb
            ViewerProtocolPolicy: redirect-to-https
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6     # Managed-CachingOptimized
            Compress: true

  # =====================================================================================
  # Traffic generator: simulated shoppers hitting the CloudFront URL (and the assistant)
  # =====================================================================================
  LoadGenLogGroup:
    Type: AWS::Logs::LogGroup
    Properties: { LogGroupName: /neonbyte/ecs/loadgen, RetentionInDays: !Ref LogRetentionDays }
  LoadGenTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    DependsOn: ContainerImages
    Properties:
      Family: neonbyte-loadgen
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "256"
      Memory: "512"
      RuntimePlatform: { CpuArchitecture: ARM64, OperatingSystemFamily: LINUX }
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      ContainerDefinitions:
        - Name: loadgen
          Image: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/neonbyte/loadgen:${ImageTag}"
          Essential: true
          Environment:
            - { Name: TARGET_URL, Value: !Sub "https://${Distribution.DomainName}" }
            - { Name: USERS, Value: !Ref LoadGenUsers }
            - { Name: CHAT_PROBABILITY, Value: !Ref LoadGenChatProbability }
            - { Name: REPORT_EVERY, Value: "300" }
          LogConfiguration:
            LogDriver: awslogs
            Options: { awslogs-group: !Ref LoadGenLogGroup, awslogs-region: !Ref "AWS::Region", awslogs-stream-prefix: loadgen }
  LoadGenSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: NeonByte traffic generator (egress only)
      VpcId: !Ref Vpc
  LoadGenService:
    Type: AWS::ECS::Service
    DependsOn: [StorefrontService, PrivateDefaultRoute]
    Properties:
      ServiceName: loadgen
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      DesiredCount: !Ref LoadGenDesiredCount
      TaskDefinition: !Ref LoadGenTaskDefinition
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets: [!Ref PrivateSubnet1, !Ref PrivateSubnet2]
          SecurityGroups: [!Ref LoadGenSecurityGroup]

  # =====================================================================================
  # AI agents on Amazon Bedrock AgentCore: Guardrail, Memory, 5 Runtimes, Gateway
  # =====================================================================================
  Guardrail:
    Type: AWS::Bedrock::Guardrail
    Condition: GuardrailOn
    Properties:
      Name: NeonByteGuardrail
      Description: Content safety, PII and topic guardrail for the NeonByte shopping assistant
      BlockedInputMessaging: I can only help with NeonByte shopping, orders and tech questions.
      BlockedOutputsMessaging: Sorry, I can't help with that - let's keep it about your gear.
      ContentPolicyConfig:
        FiltersConfig:
          - { Type: HATE, InputStrength: HIGH, OutputStrength: HIGH }
          - { Type: INSULTS, InputStrength: MEDIUM, OutputStrength: MEDIUM }
          - { Type: SEXUAL, InputStrength: HIGH, OutputStrength: HIGH }
          - { Type: VIOLENCE, InputStrength: MEDIUM, OutputStrength: MEDIUM }
          - { Type: MISCONDUCT, InputStrength: MEDIUM, OutputStrength: MEDIUM }
          # PROMPT_ATTACK off: delegation instructions and relayed tool results read as injections.
          - { Type: PROMPT_ATTACK, InputStrength: NONE, OutputStrength: NONE }
      SensitiveInformationPolicyConfig:
        PiiEntitiesConfig:
          - { Type: EMAIL, Action: ANONYMIZE }
          - { Type: PHONE, Action: ANONYMIZE }
          - { Type: CREDIT_DEBIT_CARD_NUMBER, Action: BLOCK }
      TopicPolicyConfig:
        TopicsConfig:
          - Name: DeviceTampering
            Type: DENY
            Definition: Instructions to bypass device security, jailbreak/unlock stolen devices, disable safety limits on batteries or chargers, or build signal jammers.
            Examples:
              - How do I unlock a stolen phone?
              - How can I remove the battery protection circuit so it charges faster?
              - How do I build a cell signal jammer?

  MemoryRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: bedrock-agentcore.amazonaws.com }
            Action: sts:AssumeRole
            Condition: { StringEquals: { aws:SourceAccount: !Ref "AWS::AccountId" } }
      Policies:
        - PolicyName: memory-extraction
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream]
                Resource: [!Sub "arn:${AWS::Partition}:bedrock:*::foundation-model/*", !Sub "arn:${AWS::Partition}:bedrock:*:${AWS::AccountId}:inference-profile/*"]
  Memory:
    Type: AWS::BedrockAgentCore::Memory
    Properties:
      Name: NeonByteMemory
      Description: Short + long term memory for the NeonByte assistant (actorId + sessionId scoped)
      EventExpiryDuration: 30
      MemoryExecutionRoleArn: !GetAtt MemoryRole.Arn
      MemoryStrategies:
        - SummaryMemoryStrategy:
            Name: ConversationSummary
            Namespaces: ["/neonbyte/{actorId}/{sessionId}/summary"]
        - UserPreferenceMemoryStrategy:
            Name: ShopperPreferences
            Namespaces: ["/neonbyte/{actorId}/preferences"]

  AgentRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: bedrock-agentcore.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { aws:SourceAccount: !Ref "AWS::AccountId" }
              ArnLike: { aws:SourceArn: !Sub "arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:*" }
      Policies:
        - PolicyName: neonbyte-agent
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [ssm:GetParameter, ssm:GetParameters, ssm:GetParametersByPath]
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/neonbyte/*
              - Effect: Allow
                Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream, bedrock:CountTokens, bedrock:ApplyGuardrail]
                Resource:
                  - !Sub arn:${AWS::Partition}:bedrock:*::foundation-model/*
                  - !Sub arn:${AWS::Partition}:bedrock:*:${AWS::AccountId}:*
              - Effect: Allow  # gpt-oss / Llama / Claude first use subscribes via Marketplace
                Action: [aws-marketplace:ViewSubscriptions, aws-marketplace:Subscribe]
                Resource: "*"
              - Effect: Allow
                Action: bedrock-agentcore:InvokeAgentRuntime
                Resource: !Sub arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:runtime/NeonByte*
              - Effect: Allow  # Gateway inbound auth is AWS_IAM, so without InvokeGateway delegation is a 403.
                Action: bedrock-agentcore:InvokeGateway
                Resource: !Sub arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:gateway/*
              - Effect: Allow
                Action:
                  - bedrock-agentcore:CreateEvent
                  - bedrock-agentcore:ListEvents
                  - bedrock-agentcore:GetEvent
                  - bedrock-agentcore:RetrieveMemoryRecords
                  - bedrock-agentcore:ListMemoryRecords
                  - bedrock-agentcore:GetMemoryRecord
                Resource: !GetAtt Memory.MemoryArn
              - Effect: Allow
                Action: [ecr:BatchGetImage, ecr:GetDownloadUrlForLayer]
                Resource: !Sub arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/neonbyte/*
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action: [logs:CreateLogGroup, logs:DescribeLogStreams, logs:CreateLogStream, logs:PutLogEvents]
                Resource:
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/runtimes/*
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/runtimes/*:log-stream:*
              - Effect: Allow
                Action: logs:DescribeLogGroups
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:*
              - Effect: Allow  # ADOT -> X-Ray OTLP endpoint (Transaction Search / GenAI observability)
                Action: [xray:PutTraceSegments, xray:PutTelemetryRecords, xray:GetSamplingRules, xray:GetSamplingTargets]
                Resource: "*"
              - Effect: Allow
                Action: cloudwatch:PutMetricData
                Resource: "*"
                Condition: { StringEquals: { cloudwatch:namespace: bedrock-agentcore } }
              - Effect: Allow
                Action:
                  - bedrock-agentcore:GetWorkloadAccessToken
                  - bedrock-agentcore:GetWorkloadAccessTokenForJWT
                  - bedrock-agentcore:GetWorkloadAccessTokenForUserId
                Resource:
                  - !Sub arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:workload-identity-directory/default
                  - !Sub arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:workload-identity-directory/default/workload-identity/*

  Fn::ForEach::AgentRuntimes:
    - Agent
    - [Orchestrator, Advisor, OrderDesk, Support, Concierge]
    - "${Agent}Runtime":
        Type: AWS::BedrockAgentCore::Runtime
        DependsOn: [ContainerImages, PrivateDefaultRoute]
        Properties:
          AgentRuntimeName: !Sub NeonByte${Agent}
          Description: !Sub NeonByte ${Agent} agent
          RoleArn: !GetAtt AgentRole.Arn
          AgentRuntimeArtifact:
            ContainerConfiguration:
              ContainerUri: !Sub
                - "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/neonbyte/${Repo}:${ImageTag}"
                - Repo: !FindInMap [Agents, !Ref Agent, Repo]
          NetworkConfiguration:
            NetworkMode: VPC
            NetworkModeConfig:
              Subnets: [!Ref PrivateSubnet1, !Ref PrivateSubnet2]
              SecurityGroups: [!Ref AppSecurityGroup]
          ProtocolConfiguration: HTTP
          EnvironmentVariables:
            AWS_REGION: !Ref "AWS::Region"
            PARAMETER_STORE_PREFIX: /neonbyte
            AGENT_TRANSPORT: gateway
            MEMORY_ID: !GetAtt Memory.MemoryId
            GUARDRAIL_ID: !If [GuardrailOn, !GetAtt Guardrail.GuardrailId, ""]
            GUARDRAIL_VERSION: !If [GuardrailOn, !GetAtt Guardrail.Version, ""]
            CATALOG_URL: http://catalog.neonbyte.local:8080
            CART_URL: http://cart.neonbyte.local:8080
            ORDERS_URL: http://orders.neonbyte.local:8080
            BEDROCK_CLAUDE_MODEL_ID: !Ref ClaudeModelId
            BEDROCK_NOVA_LITE_MODEL_ID: !Ref NovaLiteModelId
            BEDROCK_LLAMA_MODEL_ID: !Ref LlamaModelId
            BEDROCK_GPT_OSS_MODEL_ID: !Ref GptOssModelId
            # AgentCore observability: ADOT exports spans/logs straight to CloudWatch (no collector)
            OTEL_PYTHON_EXCLUDED_URLS: /ping
            AGENT_OBSERVABILITY_ENABLED: "true"
            AWS_AGENTIC_INSTRUMENTATION_OPT_IN: "true"
            AWS_GENAI_CONTENT_EXTRACTION_OPT_OUT: "true"
            UNIFIED_TRACES_DESTINATION_ENABLED: "true"
      # Vended runtime traces -> X-Ray and runtime application logs -> CloudWatch Logs
      # (what the console's "enable tracing / logging" for a runtime sets up).
      "${Agent}TracesSource":
        Type: AWS::Logs::DeliverySource
        Properties:
          Name: !Sub neonbyte-${Agent}-traces
          LogType: TRACES
          ResourceArn: !GetAtt [!Sub "${Agent}Runtime", AgentRuntimeArn]
      "${Agent}TracesDelivery":
        Type: AWS::Logs::Delivery
        Properties:
          DeliverySourceName: !Ref { "Fn::Sub": "${Agent}TracesSource" }
          DeliveryDestinationArn: !GetAtt XRayDeliveryDestination.Arn
      "${Agent}AppLogGroup":
        Type: AWS::Logs::LogGroup
        Properties:
          LogGroupName: !Sub /aws/vendedlogs/bedrock-agentcore/NeonByte${Agent}
          RetentionInDays: !Ref LogRetentionDays
      "${Agent}LogsSource":
        Type: AWS::Logs::DeliverySource
        Properties:
          Name: !Sub neonbyte-${Agent}-logs
          LogType: APPLICATION_LOGS
          ResourceArn: !GetAtt [!Sub "${Agent}Runtime", AgentRuntimeArn]
      "${Agent}LogsDestination":
        Type: AWS::Logs::DeliveryDestination
        Properties:
          Name: !Sub neonbyte-${Agent}-logs
          DestinationResourceArn: !GetAtt [!Sub "${Agent}AppLogGroup", Arn]
      "${Agent}LogsDelivery":
        Type: AWS::Logs::Delivery
        Properties:
          DeliverySourceName: !Ref { "Fn::Sub": "${Agent}LogsSource" }
          DeliveryDestinationArn: !GetAtt [!Sub "${Agent}LogsDestination", Arn]
  XRayDeliveryDestination:
    Type: AWS::Logs::DeliveryDestination
    Properties:
      Name: neonbyte-agent-traces
      DeliveryDestinationType: XRAY

  GatewayRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: bedrock-agentcore.amazonaws.com }
            Action: sts:AssumeRole
            Condition: { StringEquals: { aws:SourceAccount: !Ref "AWS::AccountId" } }
      Policies:
        - PolicyName: invoke-sub-agents
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: bedrock-agentcore:InvokeAgentRuntime
                Resource: !Sub arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:runtime/NeonByte*
  # Agent-to-agent routing: the orchestrator POSTs {gatewayUrl}/<target>/invocations (SigV4).
  Gateway:
    Type: AWS::BedrockAgentCore::Gateway
    Properties:
      Name: NeonByteGateway
      Description: Agent-to-agent routing for the NeonByte multi-agent assistant
      AuthorizerType: AWS_IAM
      RoleArn: !GetAtt GatewayRole.Arn
      # No ProtocolType: an MCP-protocol gateway rejects HTTP agentcoreRuntime targets.
  Fn::ForEach::GatewayTargets:
    - Agent
    - [Advisor, OrderDesk, Support, Concierge]
    - "${Agent}GatewayTarget":
        Type: AWS::BedrockAgentCore::GatewayTarget
        Properties:
          GatewayIdentifier: !GetAtt Gateway.GatewayIdentifier
          Name: !FindInMap [Agents, !Ref Agent, Target]
          Description: !Sub HTTP runtime target -> NeonByte${Agent}
          CredentialProviderConfigurations: [{ CredentialProviderType: GATEWAY_IAM_ROLE }]
          TargetConfiguration:
            Http:
              AgentcoreRuntime:
                Arn: !GetAtt [!Sub "${Agent}Runtime", AgentRuntimeArn]

  ParamGatewayUrl:
    Type: AWS::SSM::Parameter
    Properties: { Name: /neonbyte/agents/gatewayurl, Type: String, Value: !GetAtt Gateway.GatewayUrl }
  ParamOrchestratorArn:
    Type: AWS::SSM::Parameter
    Properties: { Name: /neonbyte/agents/orchestratorarn, Type: String, Value: !GetAtt OrchestratorRuntime.AgentRuntimeArn }
  ParamMemoryId:
    Type: AWS::SSM::Parameter
    Properties: { Name: /neonbyte/agents/memoryid, Type: String, Value: !GetAtt Memory.MemoryId }
  ParamStorefrontUrl:
    Type: AWS::SSM::Parameter
    Properties: { Name: /neonbyte/storefronturl, Type: String, Value: !Sub "https://${Distribution.DomainName}" }

  # =====================================================================================
  # Dashboard, log-derived metric and alarms
  # =====================================================================================
  DeclinedPaymentsMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref paymentsLogGroup
      FilterPattern: '{ $.message = "payment declined" }'
      MetricTransformations:
        - { MetricNamespace: NeonByte, MetricName: DeclinedPayments, MetricValue: "1", DefaultValue: 0 }
  OrdersPlacedMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref ordersLogGroup
      FilterPattern: '{ $.message = "order placed" }'
      MetricTransformations:
        - { MetricNamespace: NeonByte, MetricName: OrdersPlaced, MetricValue: "1", DefaultValue: 0 }
  Storefront5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: neonbyte-storefront-5xx
      AlarmDescription: Storefront is returning server errors to shoppers
      Namespace: AWS/ApplicationELB
      MetricName: HTTPCode_Target_5XX_Count
      Dimensions: [{ Name: LoadBalancer, Value: !GetAtt LoadBalancer.LoadBalancerFullName }]
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 3
      DatapointsToAlarm: 2
      Threshold: 10
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
  DeclinedPaymentsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: neonbyte-payment-declines
      AlarmDescription: Unusually many declined card payments (check /neonbyte/payments/decline_rate)
      Namespace: NeonByte
      MetricName: DeclinedPayments
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 10
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
  Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub NeonByte-${AWS::Region}
      DashboardBody: !Sub
        - |
          {"widgets":[
            {"type":"text","x":0,"y":0,"width":24,"height":2,"properties":{"markdown":"## ⚡ NeonByte Electronics — storefront ${Url} · [Application Signals](https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#application-signals:services) · [GenAI Observability](https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#gen-ai-observability/agent-core) · [Trace Map](https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#xray:service-map/map)"}},
            {"type":"metric","x":0,"y":2,"width":8,"height":6,"properties":{"title":"Storefront requests & errors (ALB)","region":"${AWS::Region}","stat":"Sum","period":60,"metrics":[
              ["AWS/ApplicationELB","RequestCount","LoadBalancer","${Alb}"],[".","HTTPCode_Target_4XX_Count",".","."],[".","HTTPCode_Target_5XX_Count",".","."]]}},
            {"type":"metric","x":8,"y":2,"width":8,"height":6,"properties":{"title":"Storefront latency (ALB)","region":"${AWS::Region}","period":60,"metrics":[
              ["AWS/ApplicationELB","TargetResponseTime","LoadBalancer","${Alb}",{"stat":"p50"}],["...",{"stat":"p99"}]]}},
            {"type":"metric","x":16,"y":2,"width":8,"height":6,"properties":{"title":"Business: orders vs declined payments","region":"${AWS::Region}","stat":"Sum","period":300,"metrics":[
              ["NeonByte","OrdersPlaced"],[".","DeclinedPayments"]]}},
            {"type":"metric","x":0,"y":8,"width":12,"height":6,"properties":{"title":"Application Signals — latency p99 by service","region":"${AWS::Region}","period":60,"metrics":[
              [{"expression":"SEARCH('{ApplicationSignals,Environment,Service} MetricName=\"Latency\" Environment=\"ecs:neonbyte-cluster\"', 'p99', 60)","id":"lat"}]]}},
            {"type":"metric","x":12,"y":8,"width":12,"height":6,"properties":{"title":"Application Signals — faults & errors by service","region":"${AWS::Region}","period":60,"metrics":[
              [{"expression":"SEARCH('{ApplicationSignals,Environment,Service} MetricName=\"Fault\" Environment=\"ecs:neonbyte-cluster\"', 'Sum', 60)","id":"f"}],
              [{"expression":"SEARCH('{ApplicationSignals,Environment,Service} MetricName=\"Error\" Environment=\"ecs:neonbyte-cluster\"', 'Sum', 60)","id":"e"}]]}},
            {"type":"metric","x":0,"y":14,"width":8,"height":6,"properties":{"title":"Bedrock invocations by model","region":"${AWS::Region}","period":300,"metrics":[
              [{"expression":"SEARCH('{AWS/Bedrock,ModelId} MetricName=\"Invocations\"', 'Sum', 300)","id":"inv"}]]}},
            {"type":"metric","x":8,"y":14,"width":8,"height":6,"properties":{"title":"Bedrock tokens by model","region":"${AWS::Region}","period":300,"metrics":[
              [{"expression":"SEARCH('{AWS/Bedrock,ModelId} MetricName=\"InputTokenCount\"', 'Sum', 300)","id":"tin"}],
              [{"expression":"SEARCH('{AWS/Bedrock,ModelId} MetricName=\"OutputTokenCount\"', 'Sum', 300)","id":"tout"}]]}},
            {"type":"metric","x":16,"y":14,"width":8,"height":6,"properties":{"title":"Bedrock latency by model","region":"${AWS::Region}","period":300,"metrics":[
              [{"expression":"SEARCH('{AWS/Bedrock,ModelId} MetricName=\"InvocationLatency\"', 'Average', 300)","id":"bl"}]]}},
            {"type":"metric","x":0,"y":20,"width":12,"height":6,"properties":{"title":"AgentCore runtime invocations / errors","region":"${AWS::Region}","period":300,"metrics":[
              [{"expression":"SEARCH('Namespace=\"AWS/Bedrock-AgentCore\" (MetricName=\"Invocations\" OR MetricName=\"SystemErrors\" OR MetricName=\"UserErrors\")', 'Sum', 300)","id":"ac"}]]}},
            {"type":"metric","x":12,"y":20,"width":12,"height":6,"properties":{"title":"ECS CPU by service (Container Insights)","region":"${AWS::Region}","period":60,"metrics":[
              [{"expression":"SEARCH('{ECS/ContainerInsights,ClusterName,ServiceName} MetricName=\"CpuUtilized\" ClusterName=\"neonbyte-cluster\"', 'Average', 60)","id":"cpu"}]]}},
            {"type":"metric","x":0,"y":26,"width":12,"height":6,"properties":{"title":"DynamoDB consumed capacity","region":"${AWS::Region}","stat":"Sum","period":60,"metrics":[
              ["AWS/DynamoDB","ConsumedReadCapacityUnits","TableName","neonbyte-products"],["...","neonbyte-carts"],["...","neonbyte-orders"],
              [".","ConsumedWriteCapacityUnits",".","neonbyte-products"],["...","neonbyte-carts"],["...","neonbyte-orders"]]}},
            {"type":"log","x":12,"y":26,"width":12,"height":6,"properties":{"title":"Recent warnings & errors (all services)","region":"${AWS::Region}","view":"table",
              "query":"SOURCE '/neonbyte/ecs/storefront' | SOURCE '/neonbyte/ecs/catalog' | SOURCE '/neonbyte/ecs/cart' | SOURCE '/neonbyte/ecs/orders' | SOURCE '/neonbyte/ecs/payments' | fields @timestamp, service, level, message, traceId | filter level in ['WARNING','ERROR'] | sort @timestamp desc | limit 50"}}
          ]}
        - Alb: !GetAtt LoadBalancer.LoadBalancerFullName
          Url: !Sub "https://${Distribution.DomainName}"

Outputs:
  StorefrontUrl:
    Description: NeonByte Electronics storefront (HTTPS via CloudFront)
    Value: !Sub https://${Distribution.DomainName}
  DashboardUrl:
    Value: !Sub https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards/dashboard/NeonByte-${AWS::Region}
  ApplicationSignalsUrl:
    Value: !Sub https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#application-signals:services
  GenAIObservabilityUrl:
    Value: !Sub https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#gen-ai-observability/agent-core
  OrchestratorRuntimeArn:
    Value: !GetAtt OrchestratorRuntime.AgentRuntimeArn
  GatewayUrl:
    Value: !GetAtt Gateway.GatewayUrl
  ImageBuildProject:
    Description: CodeBuild project that builds the images (see its logs if the stack waits on ContainerImages)
    Value: !Ref ImageBuildProject
  ImageTag:
    Value: !GetAtt ContainerImages.ImageTag
